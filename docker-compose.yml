services:
  db:
    image: postgres:16-alpine
    container_name: gaikovert-db
    restart: always
    environment:
      POSTGRES_USER: gaikovert
      POSTGRES_PASSWORD: gaikovert
      POSTGRES_DB: gaikovert
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    networks:
      - backend
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "gaikovert", "-U", "gaikovert"]
      timeout: 45s
      interval: 10s
      retries: 10

  panel:
    build:
      context: ./panel
      args:
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-}"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: gaikovert
      DB_USER: gaikovert
      DB_PASSWORD: gaikovert
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    ports:
      - "8001:8000"

  panel-ui:
    build:
      context: ./panel-ui
      args:
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-}"
        # Браузер ходит в Panel не через docker-сеть, а по адресу на хосте —
        # отсюда localhost:8001, а не "panel" (имя сервиса недоступно из браузера).
        VITE_PANEL_API_URL: "${VITE_PANEL_API_URL:-http://localhost:8001}"
    depends_on:
      - panel
    ports:
      - "8002:80"

  # Guacamole — настоящий (не заглушка): guacd + webapp + своя БД (отдельная от
  # gaikovert, схему генерирует сам образ guacamole, см. guacamole/db-init/).
  guacamole-db:
    image: postgres:16-alpine
    container_name: gaikovert-guacamole-db
    restart: always
    environment:
      POSTGRES_USER: guacamole
      POSTGRES_PASSWORD: guacamole
      POSTGRES_DB: guacamole
    volumes:
      - guacamole_db_data:/var/lib/postgresql/data
      - ./guacamole/db-init:/docker-entrypoint-initdb.d
    networks:
      - backend
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "guacamole", "-U", "guacamole"]
      timeout: 45s
      interval: 10s
      retries: 10

  guacd:
    image: guacamole/guacd:1.5.5
    container_name: gaikovert-guacd
    restart: always
    networks:
      - backend

  guacamole:
    image: guacamole/guacamole:1.5.5
    container_name: gaikovert-guacamole
    restart: always
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRESQL_HOSTNAME: guacamole-db
      POSTGRESQL_DATABASE: guacamole
      POSTGRESQL_USER: guacamole
      POSTGRESQL_PASSWORD: guacamole
    depends_on:
      guacd:
        condition: service_started
      guacamole-db:
        condition: service_healthy
    networks:
      - backend
    ports:
      - "8003:8080"

  constructor:
    build:
      context: ./constructor
      args:
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-}"
    environment:
      VM_DRIVER: "${VM_DRIVER:-mock}"
      GUACAMOLE_BASE_URL: http://guacamole:8080/guacamole
      # Браузер (через Front) ходит не по docker-service-name — тот же приём,
      # что VITE_PANEL_API_URL для PanelUI.
      GUACAMOLE_PUBLIC_URL: "${GUACAMOLE_PUBLIC_URL:-http://localhost:8003/guacamole}"
      GUACAMOLE_ADMIN_USER: guacadmin
      GUACAMOLE_ADMIN_PASSWORD: guacadmin
      GUACAMOLE_DATA_SOURCE: postgresql
      # Куда "указывать" Guacamole-подключения в mock-режиме, т.к. реальных VM
      # (libvirt/KVM) в этом окружении нет — см. constructor/README.md.
      MOCK_VM_HOST: "${MOCK_VM_HOST:-guacd}"
    depends_on:
      - guacamole
    networks:
      - backend
    ports:
      - "8004:8000"

  # front — пока не реализован (см. CLAUDE.md).

volumes:
  db_data:
  guacamole_db_data:

networks:
  backend:
    driver: bridge
