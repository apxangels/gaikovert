server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: отдаём index.html на любой маршрут, который не найден как файл —
    # роутинг (react-router) берёт на себя остальное.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
